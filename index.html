<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chat Interface</title>
  </head>
  <body>
    <div id="app">
      <div class="chat-container">
        <h1>AI Homework Helper🎓</h1>
        
        <div id="chat-display" class="chat-display">
          <div class="welcome-message">
            👋 Welcome! Help me help you organize your homework.
          </div>
        </div>

        <div class="prompt-section">
  <p class="prompt-label">💡 Try starting with something like this:</p>
<p class="prompt-template" id="prompt-template">How should I organize my time to complete [assignment] by [deadline]?</p>

  <button id="use-template" class="template-button">Use This Template</button>
</div>

<div class="input-container">
  <textarea 
    id="user-input" 
    placeholder="Type your question here..."
    rows="3"
  ></textarea>
  <button id="send-button">Send</button>
</div>


        <div id="loading" class="loading" style="display: none;">
          🤔 Thinking...
        </div>
      </div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
